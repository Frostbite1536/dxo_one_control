<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>DXO One Web Interface</title>
    <script type="module" src="./usb-page.js"></script>
    <style>
        #liveview {
            max-width: 100%;
            max-height: 600px;
            display: block;
            margin: auto;
            margin-top: 1em;
        }

        #msg {
            white-space: pre-wrap;
            font-family: monospace;
        }

        .warning {
            color: rgb(210, 90, 90);
        }
    </style>
</head>

<body>
    <h2>DXO One Web Interface</h2>
    <h4 class="warning">Only tested with microUSB connection!</h4>
    <p style="margin-bottom: 1em;">
        <a href="multi-camera.html">Switch to Multi-Camera Mode (up to 4 cameras)</a>
    </p>
    <button id="btnConnect">Connect</button>
    <button id="btnLiveView" disabled>Start live view</button>
    <button id="btnSnap" disabled>Take a photo</button>
    <img id="liveview" alt="Live view from the camera">
    <div id="msg"></div>
</body>

</html>

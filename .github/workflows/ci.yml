name: CI

on:
  push:
    branches: [ main, develop, "claude/**" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JavaScript (syntax + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # Syntax-checks every *.js / *.mjs file, then runs test/*.test.mjs
      # (transport tests against a scripted fake DXO One).
      - name: npm test
        run: npm test

  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check required files
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "docs/ARCHITECTURE.md"
            "docs/INVARIANTS.md"
            "docs/ROADMAP.md"
            "docs/DECISIONS.md"
            "prompts/README.md"
            "prompts/engineering.md"
            "android-app/gradlew"
            "android-app/gradle/wrapper/gradle-wrapper.jar"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "Found: $file"
            else
              echo "::error file=$file::Missing required file: $file"
              missing=1
            fi
          done
          exit $missing

  android:
    name: Android (build, unit tests, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Print lint report
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt || true

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-reports
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
          if-no-files-found: ignore
